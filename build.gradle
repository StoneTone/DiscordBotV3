plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.bot'
version = '2.0.15-BETA'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://maven.lavalink.dev/releases' }
    maven { url = 'https://maven.lavalink.dev/snapshots' }
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Discord JDA
    implementation 'net.dv8tion:JDA:6.5.0'

    // Lavaplayer
    implementation 'dev.arbjerg:lavaplayer:2.2.7'

    // DAVE E2EE
    implementation 'club.minnced:jdave-api:0.1.6'
    implementation 'club.minnced:jdave-native-linux-x86-64:0.1.6'
    implementation 'club.minnced:jdave-native-linux-aarch64:0.1.6'
    implementation 'club.minnced:jdave-native-win-x86-64:0.1.6'
    // implementation 'club.minnced:jdave-native-darwin:0.1.6'

    // Native audio send system (prevents GC stutter)
    implementation 'club.minnced:udpqueue-native-win-x86-64:0.2.12'
    implementation 'club.minnced:udpqueue-native-linux-aarch64:0.2.12'

    // YouTube source libs (ashton045 fork — SABR + poToken support)
    implementation 'dev.lavalink.youtube:youtube-plugin:cf77f5b59d6fc27c3be0809cc3e90aad6f8efc30'
    implementation 'dev.lavalink.youtube:common:cf77f5b59d6fc27c3be0809cc3e90aad6f8efc30-SNAPSHOT'
    implementation 'dev.lavalink.youtube:v2:cf77f5b59d6fc27c3be0809cc3e90aad6f8efc30-SNAPSHOT'

    // Twitch
    implementation 'com.github.twitch4j:twitch4j:1.25.0'

    // Utilities
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.google.guava:guava:33.2.1-jre'
    implementation 'org.json:json:20240303'

    // Logging
    implementation 'ch.qos.logback:logback-classic'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mockito:mockito-core:4.8.0'
}

tasks.named('test') {
    useJUnitPlatform()
}

bootRun {
    jvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

bootJar {
    archiveFileName = "${project.name}-${project.version}.jar"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Enable-Native-Access': 'ALL-UNNAMED'
    }
}
