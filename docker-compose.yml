services:
  discordbot:
    image: stonetone31/discordbotv3:latest
    container_name: discordbot
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - GUILD_ID=${GUILD_ID}
      - GPT_SECRET=${GPT_SECRET}
      - GPT_PROMPT=${GPT_PROMPT}
      - GPT_MODEL=${GPT_MODEL}
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID}
      - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET}
      - CIPHER_URL=http://yt-cipher:8001
      - POT_URL=http://webpo-generator:8090
      - JAVA_TOOL_OPTIONS=-Djava.io.tmpdir=/app/tmp --enable-native-access=ALL-UNNAMED
    depends_on:
      yt-cipher:
        condition: service_started
      webpo-generator:
        condition: service_healthy
    networks:
      - bot-network

  yt-cipher:
    image: ghcr.io/kikkia/yt-cipher:master
    container_name: yt-cipher
    restart: unless-stopped
    networks:
      - bot-network

  webpo-generator:
    build: https://github.com/ashton045/webpo-generator.git
    container_name: webpo-generator
    restart: unless-stopped
    environment:
      - PORT=8090
      - WORKERS=2
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8090/',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - bot-network

networks:
  bot-network:
    driver: bridge
